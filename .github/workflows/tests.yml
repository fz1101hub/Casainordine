name: Test automatici

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Installa dipendenze (versioni bloccate da package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Controlla vulnerabilità note delle dipendenze dell'app
        run: npm audit --omit=dev --audit-level=high
      - name: Esegui i test di logica
        run: npm test
      - name: Verifica build Next.js
        run: npm run build
      - name: Browser per la prova (Chromium, versione di package-lock.json)
        timeout-minutes: 10
        # Le librerie di sistema arrivano da apt: se i mirror non rispondono (capita), si prova con
        # quelle già presenti nell'immagine di GitHub, che di solito bastano.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Prova nel browser dell'app compilata (senza database)
        timeout-minutes: 5
        run: |
          npm start -- -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/smoke-browser.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
