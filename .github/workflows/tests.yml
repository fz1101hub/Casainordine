name: Test automatici

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Installa dipendenze (versioni bloccate da package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Controlla vulnerabilità note delle dipendenze dell'app
        run: npm audit --omit=dev --audit-level=high
      - name: Esegui i test di logica
        run: npm test
      - name: Verifica build Next.js
        run: npm run build
      - name: Browser per la prova (Chromium, versione di package-lock.json)
        timeout-minutes: 12
        # Prima solo il browser (dal CDN di Playwright, pochi secondi). Le librerie di sistema
        # (apt, lento e a volte irraggiungibile) si installano solo se il browser non parte.
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then(b=>b.close())" || npx playwright install-deps chromium
      - name: Prova nel browser dell'app compilata (senza database)
        timeout-minutes: 5
        run: |
          npm start -- -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/smoke-browser.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Lingue (nessun testo rimasto in italiano nella versione inglese)
        timeout-minutes: 6
        run: node scripts/check-languages.mjs http://localhost:3000
      - name: Accessibilità (WCAG 2.1 A/AA, riflusso a 320 px, contrasto dei campi)
        timeout-minutes: 6
        run: node scripts/check-accessibility.mjs http://localhost:3000
      - name: Sezioni della Fase 2 (creare, modificare ed eliminare nella demo)
        timeout-minutes: 6
        run: node scripts/prove-sezioni.mjs http://localhost:3000
      - name: Bollette fotografate (storte, scure, sfocate, piccole, con un'ombra)
        timeout-minutes: 6
        run: node scripts/prove-foto.mjs http://localhost:3000
      - name: Email dei promemoria e dei riepiloghi (come si vedono)
        timeout-minutes: 3
        run: node scripts/prove-email.mjs

  accesso:
    # L'app con accesso: compilata per un Supabase finto (tests/helpers/fake-supabase.mjs) e provata
    # nel browser con il client Supabase vero: accesso, dati, backup JSON e .zip, ripristino,
    # file sbagliati, accessibilità e uscita; poi ruoli, lingue, bozze offline e telefono.
    # La prova del lavoro «test» gira invece in demo.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chiave-pubblica-finta
      SUPABASE_SECRET_KEY: chiave-di-servizio-finta
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Installa dipendenze (versioni bloccate da package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Build Next.js per il Supabase finto
        run: npm run build
      - name: Browser per la prova (Chromium, versione di package-lock.json)
        timeout-minutes: 12
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then(b=>b.close())" || npx playwright install-deps chromium
      - name: Avvia l'app
        run: |
          npm start -- -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
      - name: Prova con accesso (accesso, dati, backup, ripristino, uscita)
        timeout-minutes: 6
        run: node scripts/prove-con-accesso.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Ruoli nelle case condivise (proprietario, modifica, sola lettura)
        timeout-minutes: 5
        run: node scripts/prove-ruoli.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Lingue con accesso (italiano e inglese)
        timeout-minutes: 8
        run: node scripts/prove-lingue-accesso.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Bozze offline con accesso
        timeout-minutes: 4
        run: node scripts/prove-offline-accesso.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Telefono e computer con accesso (360 e 1360 px)
        timeout-minutes: 8
        run: node scripts/prove-schermi-accesso.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Tastiera e lettori di schermo
        timeout-minutes: 6
        run: node scripts/prove-tastiera-accesso.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Eliminazione dell'account (telefono condiviso)
        timeout-minutes: 4
        run: node scripts/prove-eliminazione-account.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Lavoro notturno con molti dati (400 persone, 4000 bollette)
        timeout-minutes: 4
        run: node scripts/prove-notte.mjs http://localhost:3000
      - name: Telefono lento (3G e processore lento; dati scaricati una volta sola)
        timeout-minutes: 6
        run: node scripts/prove-telefono-lento.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Tanti dati sul telefono (3000 bollette di cinque anni, 1000 righe per richiesta)
        timeout-minutes: 6
        run: node scripts/prove-molti-dati.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Backup e ripristino grandi (cinque anni di dati e 60 file, sul telefono)
        timeout-minutes: 8
        run: node scripts/prove-backup-grande.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Due persone insieme nella stessa casa (pagamenti, eliminazioni, spesa, dati aggiornati)
        timeout-minutes: 5
        run: node scripts/prove-due-persone.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Primo utilizzo sul telefono, nelle sei lingue
        timeout-minutes: 8
        run: node scripts/prove-primo-utilizzo.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: File originali, foto HEIC e foto grandi
        timeout-minutes: 6
        run: node scripts/prove-file-originali.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Giardino e orto
        timeout-minutes: 5
        run: node scripts/prove-giardino.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Foto e diario delle piante
        timeout-minutes: 4
        run: node scripts/prove-foto-piante.mjs http://localhost:3000 || (tail -50 next.log; exit 1)
      - name: Animali di casa
        timeout-minutes: 5
        run: node scripts/prove-animali.mjs http://localhost:3000 || (tail -50 next.log; exit 1)

  database:
    # Migrazioni e prove del database su PostgreSQL 17 (la versione di Supabase), con un
    # sostituto minimo di Supabase: regole di accesso, trigger, vincoli e funzioni privilegiate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove del database (migrazioni, regole di accesso, funzioni)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db-tests.sh
